  <text x="320" y="296" font-family="Cinzel, Marcellus, 'Trajan Pro', serif" font-weight="500" font-size="32" letter-spacing="4" text-anchor="middle" fill="#F7F3E9">RTAMBHARESHVARA MANDIR</text>

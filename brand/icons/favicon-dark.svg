  </defs>
  <text x="14.87" y="22" font-family="Cinzel, Marcellus, 'Trajan Pro', serif" font-weight="700" font-size="26" text-anchor="middle" fill="#F7F3E9">R</text>
  <circle cx="16" cy="27.2" r="2.86" fill="#C8A15A"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" role="img" aria-labelledby="rtam-temple-wordmark-devanagari-garbhagriha-title rtam-temple-wordmark-devanagari-garbhagriha-desc">
  <title id="rtam-temple-wordmark-devanagari-garbhagriha-title">ऋतम्भरेश्वर मंदिर — Devanagari Mandir wordmark for the sanctum dark</title>
  <desc id="rtam-temple-wordmark-devanagari-garbhagriha-desc">Garbhagriha-register Mandir voice, Devanagari form (P3.3, closing the named gap): bhasma-ash script, stacked, transparent ground for mahakala surfaces — the city-poster and street-banner voice.</desc>
  <defs>
    <style type="text/css">@import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&amp;display=swap');</style>
  </defs>
  <text x="540" y="130" font-family="'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', serif" font-size="76" text-anchor="middle" fill="#C9C2B6">ऋतम्भरेश्वर</text>
  <text x="540" y="210" font-family="'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', serif" font-size="40" text-anchor="middle" fill="#C9C2B6">मंदिर</text>
</svg>

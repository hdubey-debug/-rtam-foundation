<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temple turntable renderer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 43%, rgba(113, 91, 61, 0.2) 0%, rgba(32, 29, 25, 0.1) 34%, transparent 62%),
          linear-gradient(150deg, #171815 0%, #292721 52%, #111310 100%);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #fade {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: #111310;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="fade"></div>
    <script type="module" src="/scripts/turntable-page.ts"></script>
  </body>
</html>

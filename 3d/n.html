<style>
/* One screen, in the posters' night register. Upright it is the A2 poster: the name on top, the picture in the middle,
   the foot below. Sideways it is the A3 board: the name column on the left, the picture on the right. */
@font-face { font-family: 'Tiro'; src: url('fonts/tiro-devanagari-sanskrit-400.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'Cinzel'; font-weight: 500; src: url('fonts/cinzel-500.ttf') format('truetype'); font-display: swap; }
:root {
  color-scheme: dark;
  --ground: #141414; --ash: #C9C2B6; --quiet: #8F887C; --hair: rgba(201,194,182,.28); --lamp: #f3d9a0;
  --deva: 'Tiro', 'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', 'Kohinoor Devanagari', 'Devanagari Sangam MN', serif;
  --caps: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --ease: cubic-bezier(.45, .05, .25, 1);
}
* { box-sizing: border-box }
.nb { white-space: nowrap }
[hidden] { display: none !important }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ash); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none }
body { font: 400 16px/1.4 var(--deva) }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation }
button:focus-visible, a:focus-visible { outline: 1px solid currentColor; outline-offset: 4px }
img, video { display: block }
.en { font-family: var(--caps); font-weight: 500; text-transform: uppercase }
#app { position: fixed; inset: 0; overflow: hidden }

/* the 3D, full screen behind everything; it appears when the lamps hand over */
#gl { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.4s var(--ease); touch-action: none }
.s-walk #gl { opacity: 1 }

/* the name and the captions stay readable over the stone: the 3D itself fades out behind them, so only the page's own
   black is ever there (a dark veil laid over the page would band against it) */
.scrim { display: none }
#gl { --m: linear-gradient(transparent calc(var(--fadeTop, 18vh) - 7vh), #000 var(--fadeTop, 18vh), #000 calc(var(--fadeBot, 70vh) - 8vh), transparent var(--fadeBot, 70vh));
      -webkit-mask: var(--m); mask: var(--m) }

/* the picture area: the poster frame, the film, the lamps (with the poster's side margins) */
#stage { position: absolute; left: 0; right: 0; top: 33vh; height: 45vh; pointer-events: none; container-type: size; transition: top .9s var(--ease), height .9s var(--ease) }
#frame { position: absolute; left: 50%; top: 50%; width: min(92cqw, 133.333cqh); aspect-ratio: 4 / 3; transform: translate(-50%, -50%);
  /* its edges dissolve into the page: a film's black can decode a level or two off the page's, and no edge may show */
  -webkit-mask: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent), linear-gradient(transparent, #000 5%, #000 90%, transparent);
  -webkit-mask-composite: source-in; mask: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent), linear-gradient(transparent, #000 5%, #000 90%, transparent);
  mask-composite: intersect }
#frame > * { position: absolute; inset: 0; width: 100%; height: 100% }
/* the pictures lie on the page's black and lighten it: where a film's black decodes a level dark, the page's shows */
#frame { background: var(--ground); transition: background-color 1.6s .3s }
#frame > img, #frame > video { mix-blend-mode: lighten }
.s-walk #frame { background-color: transparent }
[data-tier="still"].s-walk #frame { background-color: var(--ground) }
#still, #film, #lamps, #last { opacity: 0; transition: opacity .9s var(--ease) }
.s-poster #still { opacity: 1 }
.s-film #film, .s-hold #last { opacity: 1 }
.s-handoff #lamps { opacity: 1 }
.s-walk #lamps { opacity: 0; transition: opacity 1.6s .3s var(--ease) }
[data-tier="still"].s-walk #still { opacity: 1 }
#frame > #thread { inset: auto; left: var(--tx, 50%); top: var(--ty, 50%); width: 2px; height: var(--th, 6%); margin-left: -1px; border-radius: 1px; opacity: 0;
  background: linear-gradient(transparent, var(--lamp) 25%, var(--lamp) 75%, transparent); box-shadow: 0 0 10px rgba(243,217,160,.8) }
.s-poster #thread, .s-hold #thread { animation: thread 1.8s ease-in-out infinite alternate }
@keyframes thread { from { opacity: .15 } to { opacity: calc(.45 + var(--p, 0) * .55) } }

/* the name: upright, on top (as the A2 poster). When the film ends the poster opens up: the name steps back and the
   picture rises to where the walk happens; only then does it dim to its lamps and the stone return (the lamps never move) */
#title { position: absolute; left: 0; right: 0; top: calc(var(--st) + 5vh); display: flex; flex-direction: column; align-items: center; gap: 1.2vh;
  pointer-events: none; transform-origin: 50% 0; transition: transform .9s var(--ease), opacity .6s }
#title .lotus { display: none }
#title .kicker { width: min(46vw, 260px); transition: opacity .6s }
#title .lockup { width: min(84vw, 470px); margin-top: -1vh }
:is(.s-hold, .s-handoff, .s-walk) #title { transform: translateY(-2vh) scale(.62) }
:is(.s-hold, .s-handoff, .s-walk) #title .kicker { opacity: 0 }
:is(.s-hold, .s-handoff, .s-walk) #stage { top: 21vh; height: 53vh }
/* close to the stone the name steps away (the lockup never sits on a busy picture) */

#side { display: contents }
/* the walk: a caption, where one is on the path, and where to go; text only, as the posters */
#ui { position: absolute; left: 0; right: 0; bottom: calc(var(--sb) + 14.5vh); display: flex; flex-direction: column; align-items: center; gap: 1.4vh;
  opacity: 0; pointer-events: none; transition: opacity .8s .4s }
.s-walk #ui { opacity: 1 }
.s-walk #ui button { pointer-events: auto }
#caption { margin: 0; text-align: center; display: flex; flex-direction: column; gap: 4px; min-height: 3.2em; padding-inline: 16px; transition: opacity .35s }
#caption .dn { font: 400 clamp(17px, 5vw, 22px)/1.25 var(--deva) }
#caption .en { font-size: clamp(8px, 2.3vw, 10px); line-height: 1.3; letter-spacing: .22em; color: var(--quiet) }
#caption.fade { opacity: 0 }
/* प्रदक्षिणा: a dial (the building seen from above, its front at the top; the dot is where you stand) that walks you round */
#walk { display: flex; align-items: center; gap: 11px; padding: 6px 12px; color: var(--ash) }
#walk .dial { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--hair); flex: none; transition: border-color .4s }
#walk .dial i { position: absolute; inset: 0 }
#walk .dial i::before { content: ''; position: absolute; left: 50%; top: -3.5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ash); transition: background .4s, box-shadow .4s }
#walk .lbl { display: flex; flex-direction: column; align-items: flex-start; gap: 4px }
#walk .lbl > span:first-child { font: 400 clamp(14px, 4vw, 16px)/1 var(--deva) }
#walk .lbl .en { font-size: 7.5px; letter-spacing: .2em; color: var(--quiet) }
#walk.on .dial { border-color: rgba(243,217,160,.6) } #walk.on .dial i::before { background: var(--lamp); box-shadow: 0 0 9px rgba(243,217,160,.9) }
/* what to walk round: the temple, Nandi's mandapa, or the whole complex */
#modes { display: flex; justify-content: center; gap: clamp(10px, 5vw, 30px) }
#modes button { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 8px 6px; color: var(--quiet); transition: color .3s }
#modes button > span:first-child { font: 400 clamp(15px, 4.4vw, 18px)/1 var(--deva) }
#modes button .en { font-size: 7.5px; letter-spacing: .2em; color: var(--quiet); transition: color .3s }
#modes button::after { content: ''; width: 16px; height: 1px; margin-top: 2px; background: transparent; transition: background .3s }
#modes button.on, #modes button.on .en { color: var(--ash) } #modes button.on::after { background: var(--ash) }

/* the foot: as the A2 poster's (the chakra, the full address pair, and in the QR's place, sharing) */
#foot { position: absolute; left: calc(var(--sl) + 5vw); right: calc(var(--sr) + 5vw); bottom: calc(var(--sb) + 2.6vh); display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: opacity .6s }
#foot .lotus { width: 38px; height: 38px; flex: none }
.addr { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; text-align: center }
.addr .dn { font: 400 clamp(11.5px, 3.3vw, 14px)/1.3 var(--deva); text-wrap: balance }
.addr .en { font-size: clamp(6.5px, 1.85vw, 8px); line-height: 1.45; letter-spacing: .16em; color: var(--quiet); text-wrap: balance }
.txt { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; min-width: 44px; padding: 8px 0 }
.txt > span:first-child { font: 400 clamp(13px, 3.8vw, 15px)/1 var(--deva) }
.txt .en { font-size: 7px; letter-spacing: .2em; color: var(--quiet) }
.s-film #foot { opacity: 0; pointer-events: none }

/* moments */
/* when the phone will not start the film by itself: a lamp to light, plainly a thing to tap (it breathes and rings) */
#play { position: absolute; left: 50%; bottom: calc(var(--sb) + 14vh); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 12px 18px; white-space: nowrap }
#play .lamp { position: relative; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid rgba(243,217,160,.7); background: radial-gradient(closest-side, rgba(243,217,160,.22), rgba(243,217,160,.04) 70%, transparent) }
#play .lamp::before, #play .lamp::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid var(--lamp); animation: ring 2.4s ease-out infinite }
#play .lamp::after { animation-delay: 1.2s }
@keyframes ring { from { transform: scale(1); opacity: .75 } to { transform: scale(1.75); opacity: 0 } }
#play .lamp svg { width: 24px; height: 24px; fill: var(--lamp); filter: drop-shadow(0 0 6px rgba(243,217,160,.9)); transform-origin: 50% 85%; animation: flame 1.6s ease-in-out infinite alternate }
@keyframes flame { from { transform: scale(.94) rotate(-2deg) } to { transform: scale(1.06) rotate(2deg) } }
#play > span:nth-child(2) { font: 400 21px/1 var(--deva) } #play .en { font-size: 8.5px; letter-spacing: .22em; color: var(--ash) }
#skip { position: absolute; top: calc(var(--st) + 10px); right: calc(var(--sr) + 10px); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px; opacity: 0; transition: opacity .5s }
#skip > span:first-child { font: 400 15px/1 var(--deva) } #skip .en { font-size: 7px; letter-spacing: .2em; color: var(--quiet) }
.s-film #skip { opacity: 1 }

/* the address and contact sheet */
#visit { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto; background: #1b1a18; color: var(--ash); border-top: 1px solid var(--hair);
  border-radius: 4px 4px 0 0; padding: 26px 22px calc(var(--sb) + 22px); display: flex; flex-direction: column; gap: 16px; transform: translateY(105%); transition: transform .5s var(--ease); -webkit-user-select: text; user-select: text }
#visit.on { transform: none }
#visit h2 { margin: 0; padding-right: 72px; font: 400 24px/1.2 var(--deva) } #visit h2 .en { display: block; font-size: 9px; letter-spacing: .22em; color: var(--quiet); margin-top: 6px }
#visit p { margin: 0 } #visit .dn { font: 400 17px/1.45 var(--deva) } #visit p.en { font-size: 10px; line-height: 1.6; letter-spacing: .16em; color: var(--quiet) }
#visit ul { list-style: none; margin: 4px 0 0; padding: 0; border-top: 1px solid var(--hair) }
#visit li { border-bottom: 1px solid var(--hair) }
#visit li > a, #visit li > button { width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 15px 2px; color: inherit; text-decoration: none; font: 400 18px/1.2 var(--deva); text-align: left }
#visit li .en { font-size: 8.5px; letter-spacing: .2em; color: var(--quiet) }
#visit .close { position: absolute; top: 14px; right: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px }
#visit .close > span:first-child { font: 400 14px/1 var(--deva) } #visit .close .en { font-size: 7px; letter-spacing: .2em; color: var(--quiet) }
#visit .note { font: 400 13px/1.4 var(--deva); color: var(--quiet) } #visit .note .en { font-size: 8px; letter-spacing: .2em; margin-left: 8px }

/* sideways: the A3 board (the name column left, the picture right) */
@media (orientation: landscape) {
  #gl { -webkit-mask: linear-gradient(90deg, transparent calc(var(--sl) + 33vw), #000 calc(var(--sl) + 43vw)); mask: linear-gradient(90deg, transparent calc(var(--sl) + 33vw), #000 calc(var(--sl) + 43vw)) }
  /* the name column, as the A3 board's: the lotus and the name at its top, the walk's controls, the foot at its bottom;
     one flowing column sized by the phone's height, so nothing can overlap */
  #side { position: absolute; left: calc(var(--sl) + 3vw); width: 38vw; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; gap: 1.5vh; padding: calc(var(--st) + 4vh) 0 calc(var(--sb) + 2.5vh); pointer-events: none }
  #side > * { position: relative !important; inset: auto !important; transform: none !important }
  /* the picture: everything right of the name column, as large as fits, up to a size where the models stay crisp */
  #stage, :is(.s-hold, .s-handoff, .s-walk) #stage { left: 42vw; right: calc(var(--sr) + 1.5vw); top: calc(var(--st) + 3vh); bottom: calc(var(--sb) + 3vh); height: auto }
  #frame { width: min(100cqw, 133.333cqh, 1000px) }
  #title { gap: 1.2vh; width: 100% }
  #title .lotus { display: block; width: min(7vh, 48px) }
  #title .kicker { width: min(21vw, 31vh) }
  #title .lockup { width: min(25vw, 40vh); margin-top: 0 }
  #ui { gap: 1.2vh; width: 100% }
  #caption { min-height: 2.6em; justify-content: center; padding-inline: 0 }     /* a steady height: the controls never jump */
  #caption .dn { font-size: clamp(14px, 4.6vh, 19px) } #caption .en { font-size: clamp(7px, 2.2vh, 9px) }
  #walk { padding-block: 2px }
  #modes button { padding-block: 6px 4px }
  #foot { width: 100%; justify-content: center; gap: 30px; pointer-events: auto }
  .s-film #foot { pointer-events: none }
  #foot .lotus, #foot .addr > span { display: none }
  #foot .addr::before { content: 'पता · संपर्क'; font: 400 14px/1 var(--deva) }
  #foot .addr::after { content: 'ADDRESS · CONTACT'; font: 500 7px/1 var(--caps); letter-spacing: .2em; color: var(--quiet) }
  #foot .addr { gap: 4px; padding: 6px 0 }
  #foot .txt { padding: 6px 0 }
  #play { left: calc(var(--sl) + 22vw); bottom: calc(var(--sb) + 13vh); gap: 1.6vh }
  #play .lamp { width: min(52px, 13vh); height: min(52px, 13vh) }
  #visit { left: auto; right: 0; top: 0; bottom: 0; width: min(440px, 60vw); max-height: none; border-radius: 4px 0 0 4px; transform: translateX(105%) }
}
.rot, .rot * { transition: none !important }
/* big sideways screens (a laptop, a desktop): the column's words and controls grow with it */
@media (orientation: landscape) and (min-height: 700px) {
  #caption .dn { font-size: 24px } #caption .en { font-size: 10.5px }
  #walk .dial { width: 32px; height: 32px } #walk .lbl > span:first-child { font-size: 19px } #walk .lbl .en { font-size: 9px }
  #modes { gap: 36px } #modes button > span:first-child { font-size: 22px } #modes button .en { font-size: 9px }
  #foot .addr::before { font-size: 17px } #foot .addr::after { font-size: 8.5px } .txt > span:first-child { font-size: 17px } .txt .en { font-size: 8.5px }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; animation: none !important } }
</style>
